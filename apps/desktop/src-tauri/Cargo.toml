[package]
name = "desk-code-agent"
version = "0.2.0"
description = "Local-first software engineering workspace"
authors = ["Desk Code Agent contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_code_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
