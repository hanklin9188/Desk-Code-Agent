<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Desk Code Agent portfolio cover</title>
  <desc id="desc">A dark local-first engineering workspace diagram connecting repository evidence, a bounded model proposal, deterministic verification, and rollback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#080d14"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#9db7ff"/><stop offset="1" stop-color="#7595f4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="560" rx="24" fill="url(#bg)"/>
  <circle cx="1160" cy="40" r="360" fill="#24365d" opacity=".28"/>
