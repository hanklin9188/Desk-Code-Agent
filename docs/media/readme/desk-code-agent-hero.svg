    <circle cx="25" cy="25" r="5" fill="#69d59c"/><text x="40" y="30" fill="#9aa9bc" font-size="12">typed engineering workflow · fixture evidence</text>
    <g transform="translate(34 84)" font-size="12">
      <g><rect width="150" height="70" rx="10" fill="#172131" stroke="#35455d"/><text x="18" y="28" fill="#8293aa">REPOSITORY</text><text x="18" y="49" fill="#f0f4f9" font-weight="700">Map + retrieve</text></g>
      <path d="M150 35h55" stroke="#789bfa" stroke-width="2"/><path d="m198 29 8 6-8 6" fill="none" stroke="#789bfa" stroke-width="2"/>
