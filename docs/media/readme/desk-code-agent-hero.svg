      <g transform="translate(0 112)"><rect width="538" height="72" rx="10" fill="#0d151f" stroke="#263448"/><text x="18" y="25" fill="#7f8fa4">EVIDENCE</text><text x="18" y="49" fill="#cbd6e4">Files · symbols · tests · exact source hashes</text><text x="472" y="49" fill="#69d59c" font-weight="700">CITED</text></g>
