    <text x="72" y="232" fill="#f3f6fb" font-size="45" font-weight="720" letter-spacing="-1.6">Machine-verified boundaries.</text>
    <text x="72" y="276" fill="#99a8ba" font-size="17">A local-first, verification-first software-engineering workbench</text>
    <text x="72" y="301" fill="#99a8ba" font-size="17">for small language models.</text>
